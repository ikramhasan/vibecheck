<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f6f6f7;
    --line: rgba(0, 0, 0, 0.08);
    --fg: #1d1d1f;
    --muted: rgba(0, 0, 0, 0.5);
    --added: #1a7f37;
    --removed: #cf222e;
    --control: rgba(0, 0, 0, 0.06);
    --control-on: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070707;
      --sidebar: #111112;
      --line: rgba(255, 255, 255, 0.08);
      --fg: #f5f5f7;
      --muted: rgba(255, 255, 255, 0.5);
      --added: #3fb950;
      --removed: #f85149;
      --control: rgba(255, 255, 255, 0.08);
      --control-on: rgba(255, 255, 255, 0.16);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
               font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-columns: 280px 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--sidebar); border-right: 1px solid var(--line); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px 0 16px; flex-shrink: 0;
           border-bottom: 1px solid var(--line); }
  #summary { flex: 1; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #summary .added { color: var(--added); }
  #summary .removed { color: var(--removed); }
  .segmented { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--control); }
  .segmented button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
                      padding: 3px 10px; border-radius: 5px; cursor: default; }
  .segmented button[aria-pressed="true"] { background: var(--control-on); color: var(--fg);
                                           box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.15); }
  #tree { flex: 1; min-height: 0; }
  #diffs { flex: 1; min-height: 0; overflow: auto; }
  #empty { display: none; position: fixed; inset: 0; place-items: center; color: var(--muted); }
  body.empty #empty { display: grid; }
  body.empty aside, body.empty main, body.loading aside, body.loading main { visibility: hidden; }
  body.loading #empty { display: none; }
</style>
<script type="module" src="viewer.js"></script>
</head>
<body class="loading">
  <aside><div id="tree"></div></aside>
  <main>
    <header>
      <div id="summary"></div>
      <div class="segmented" role="group" aria-label="Layout">
        <button type="button" data-style="unified">Unified</button>
        <button type="button" data-style="split">Split</button>
      </div>
    </header>
    <div id="diffs"></div>
  </main>
  <div id="empty">No changes since this session started</div>
</body>
</html>
