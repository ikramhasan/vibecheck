name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    env:
      TAP: ikramhasan/homebrew-tap
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$PWD/apps/macos/build/vibecheck-$VERSION.zip" >> "$GITHUB_ENV"
          apps/macos/scripts/bundle.sh "$VERSION"

      - name: Write the changelog
        run: |
          apps/macos/scripts/changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      - name: Sign the zip for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" | apps/macos/.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$ZIP")"
          echo "SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Publish the zip as a release of the tap
        run: |
          {
            cat "$RUNNER_TEMP/changelog.md"
            echo
            echo "Install with \`brew install --cask ikramhasan/tap/vibecheck\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$TAP" \
            --title "vibecheck $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Point the cask and the appcast at the new release
        run: |
          SHA256="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap
          cd tap
          sed -i '' \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Casks/vibecheck.rb
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>vibecheck</title>
              <item>
                <title>vibecheck ${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/${TAP}/releases</sparkle:fullReleaseNotesLink>
                <description sparkle:format="markdown"><![CDATA[
          $(cat "$RUNNER_TEMP/changelog.md")
                ]]></description>
                <enclosure url="https://github.com/${TAP}/releases/download/${GITHUB_REF_NAME}/vibecheck-${VERSION}.zip"
                           type="application/octet-stream" ${SIGNATURE} />
              </item>
            </channel>
          </rss>
          XML
          git add Casks/vibecheck.rb appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vibecheck ${VERSION}"
          git push
